name: "Learning Pipelines with GitHub Actions - Deploy"

run-name: ${{ github.actor }} is learning pipelines with GitHub Actions

on:
  push:
    branches: [main]

jobs:
  Deployment-Pipeline: # Ajout d'un nom de job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Make tests
        run: npm test

      - name: Deploy Completed
        run: echo "Deploying to production completed successfully"
